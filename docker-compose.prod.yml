# Production Docker Compose configuration with Nginx reverse proxy
# For M3 machine deployment with SSL/HTTPS support

version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./temp_sessions:/app/temp_sessions
      - ./logs:/app/logs
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - app-network

  cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -c "import asyncio; from backend.services.cleanup_service import CleanupService; asyncio.run(CleanupService().start()); asyncio.get_event_loop().run_forever()"
    volumes:
      - ./temp_sessions:/app/temp_sessions
      - ./logs:/app/logs
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

